<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 운세 번호</title>
<meta name="description" content="생년월일과 지금 시각으로 뽑는 0~999 행운 번호, 운세와 행운의 물건. 무료로 바로 확인하세요.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://choijunrak.github.io/lucky_number/">
<meta property="og:title" content="오늘의 운세 번호">
<meta property="og:description" content="생년월일과 지금 이 순간으로 뽑는 0~999 행운 번호와 행운의 물건">
<meta property="og:image" content="https://choijunrak.github.io/lucky_number/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://choijunrak.github.io/lucky_number/og.png">
<link rel="icon" href="banner.png">
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a single talisman slip (부적) centered on the page; input on top, the 3-digit number stamped in red below, the math shown as a receipt line. */
:root{
  --bg:#efe6cf; --paper:#f8eebb; --ink:#2a1f14; --muted:#6e5d45; --seal:#b4231a; --line:#d6c48a; --card:#fffaf0; --sv:#2a1f14;
  --display:"Song Myung","Gowun Batang",serif;
  --body:"Gowun Batang","Apple SD Gothic Neo","Malgun Gothic",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17130e; --paper:#2a2317; --ink:#f1e6c8; --muted:#b5a382; --seal:#e0574a; --line:#4b3f2a; --card:#efe6cf; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17130e; --paper:#2a2317; --ink:#f1e6c8; --muted:#b5a382; --seal:#e0574a; --line:#4b3f2a; --card:#efe6cf; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:40px}
.slip{max-width:440px;margin:0 auto;background:var(--paper);border:1px solid var(--line);
  padding:32px 28px 28px;display:grid;gap:24px;position:relative}
.slip::before{content:"";position:absolute;inset:8px;border:2px solid var(--seal);opacity:.55;pointer-events:none}
h1{font-family:var(--display);font-weight:400;font-size:2rem;margin:0;text-align:center;letter-spacing:.08em;text-wrap:balance}
.sub{margin:-16px 0 0;text-align:center;color:var(--muted);font-size:.9rem}
form{display:flex;gap:8px;flex-wrap:wrap}
label{width:100%;font-size:.8rem;color:var(--muted);letter-spacing:.1em}
input{flex:1;min-width:0;font-family:var(--mono);font-size:1.2rem;padding:10px 12px;background:transparent;color:var(--ink);
  border:1px solid var(--ink);border-radius:0}
button{font-family:var(--body);font-weight:700;font-size:1rem;padding:10px 18px;background:var(--seal);color:#fff8ec;border:0;cursor:pointer}
input:focus-visible,button:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
.err{color:var(--seal);font-size:.9rem;margin:0}
.result{display:grid;gap:14px;justify-items:center}
.digits{display:flex;gap:10px}
.d{box-sizing:border-box;width:84px;height:108px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  border:2px solid var(--seal);background:var(--card)}
.d svg{width:56px;height:56px;display:block}
.d .cap{font-size:.75rem;line-height:1;color:var(--ink);white-space:nowrap}
.d .cap b{font-family:var(--display);font-weight:400;font-size:1.1rem;color:var(--seal);margin-right:3px;font-variant-numeric:tabular-nums}
.d.extra{margin-left:10px;border-style:double;border-width:4px;background:var(--paper)}
@media (max-width:480px){
  .digits{gap:6px}
  .result .d{width:62px;height:90px}
  .result .d svg{width:42px;height:42px}
  .result .d .cap{font-size:.62rem}
  .d.extra{margin-left:6px}
}
.d.pop{animation:stamp .45s ease-out both}
@keyframes stamp{from{transform:scale(1.5) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
/* 인스타그램 게시물(4:5) 비율의 운세 카드. 글자 크기는 카드 너비(cqw)에 맞춰 같이 커지고 작아진다 */
.final{display:grid;justify-items:center;padding-bottom:20px;border-bottom:1px dashed var(--line)}
.insta{width:100%;max-width:400px;aspect-ratio:4/5;container-type:inline-size;position:relative;box-sizing:border-box;
  background:var(--card);border:1px solid var(--line);box-shadow:0 6px 18px rgba(80,40,10,.18);
  display:grid;grid-template-rows:auto 1fr auto auto;overflow:hidden}
.insta::before{content:"";position:absolute;inset:3cqw;border:.6cqw double var(--seal);opacity:.7;pointer-events:none}
.ig-top{display:flex;align-items:flex-start;justify-content:space-between;gap:3cqw;padding:7.5cqw 8cqw 0}
.ig-num{display:grid;line-height:1}
.ig-num small{font-size:2.8cqw;color:#6e5d45;letter-spacing:.15em;margin-bottom:.8cqw}
.ig-who{display:flex;align-items:center;gap:2.2cqw;text-align:right;padding-top:1cqw}
.ig-avatar{width:9cqw;height:9cqw;border-radius:50%;background:var(--seal);color:#fff8ec;display:grid;place-items:center;
  font-family:var(--display);font-size:4.6cqw;line-height:1;flex:none}
.ig-name{font-weight:700;font-size:3.6cqw;color:#2a1f14;line-height:1.2}
.ig-name small{display:block;font-weight:400;font-size:2.8cqw;color:#6e5d45}
.ig-body{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 8cqw;gap:2cqw;min-height:0}
.final-num{font-family:var(--display);font-size:17cqw;line-height:.9;color:#b4231a;font-variant-numeric:tabular-nums}
.final-num.pop{animation:stamp .5s ease-out both}
@media (prefers-reduced-motion:reduce){.d.pop,.final-num.pop{animation:none}}
.grade{font-size:3.4cqw;font-weight:700;padding:.6cqw 3cqw;border:.4cqw solid #b4231a;color:#b4231a;letter-spacing:.3em;text-indent:.3em}
.grade.top{background:#b4231a;color:#fff8ec}
.reading{display:contents}
.reading h3{margin:0;font-family:var(--display);font-weight:400;font-size:6.6cqw;line-height:1.25;color:#2a1f14;text-wrap:balance;word-break:keep-all}
.reading p{margin:0;font-size:3.8cqw;line-height:1.6;color:#3d2f20;word-break:keep-all;text-wrap:balance}
.lucky{display:grid;justify-items:center;gap:1.2cqw}
.lucky svg{width:34cqw;height:34cqw;background:#f8eebb;border-radius:50%;padding:5cqw;box-sizing:border-box}
.lucky div{display:grid;gap:.2cqw;justify-items:center}
.lucky span{font-size:2.8cqw;color:#6e5d45;letter-spacing:.15em}
.lucky b{color:#2a1f14;font-weight:700;font-size:4.8cqw}
.txt{display:flex;align-items:center;gap:2.4cqw;justify-content:center;flex-wrap:wrap;margin-top:1cqw}
.ig-msg{margin:0 8cqw 2.4cqw;padding-top:2.4cqw;border-top:.3cqw dashed #d6c48a;text-align:center;font-size:3.2cqw;line-height:1.5;color:#b4231a;font-weight:700;word-break:keep-all}
.ig-sample{position:absolute;left:50%;top:1.2cqw;transform:translateX(-50%);z-index:1;white-space:nowrap;background:#2a1f14;color:#fff8ec;font-size:2.6cqw;padding:.6cqw 2.6cqw;border-radius:99px}
.share{width:100%;max-width:400px;display:grid;gap:8px;margin-top:14px}
.share-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.share-btns button{padding:11px 8px;font-size:.95rem}
.share-btns button.ghost{background:transparent;color:var(--seal);border:1.5px solid var(--seal)}
.share-btns button:disabled{opacity:.6;cursor:progress}
.share-msg{margin:0;min-height:1.4em;font-size:.85rem;color:var(--muted);text-align:center}
#shareFallback{width:100%;box-sizing:border-box;min-height:7em;font:inherit;font-size:.85rem;padding:8px;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.share-preview{margin:0;display:grid;gap:6px}
.share-preview img{width:100%;border:1px solid var(--line)}
.share-preview figcaption{font-size:.8rem;color:var(--muted);text-align:center;word-break:keep-all}
.ig-foot{display:flex;justify-content:space-between;align-items:center;padding:0 7cqw 6cqw;font-size:2.9cqw;color:#b4231a}
.ig-foot span:last-child{color:#6e5d45}
@media (max-width:480px){.slip{padding-left:14px;padding-right:14px}}
/* 휴대폰: 생년월일 입력 + 버튼을 맨 위 한 줄로, 그 아래 카드를 화면 높이에 맞춰 스크롤 없이 한 화면에 */
@media (max-width:600px){
  body{padding-block:8px}
  .slip{padding-top:14px;padding-bottom:20px;gap:12px}
  .slip::before{inset:5px}
  #f{order:-1;gap:4px 8px;flex-wrap:wrap;align-items:stretch}
  #f label[for="birth"]{font-size:.75rem;letter-spacing:.05em}
  #f label[for="time"],#time{display:none}
  #birth{font-size:1.05rem;padding:8px 10px}
  #f button{width:auto!important;flex:none;padding:8px 12px;font-size:.9rem;white-space:nowrap}
  .final{padding-bottom:12px}
  .insta{width:min(100%,calc((100vh - 128px) * .8));width:min(100%,calc((100svh - 128px) * .8))}
}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px;width:100%;border-top:1px dashed var(--line);padding-top:12px}
li{display:grid;grid-template-columns:3.2em 1fr;gap:8px}
.tag{margin:0;font-size:.8rem;letter-spacing:.1em;color:var(--muted)}
#minTag,#secTag{margin-top:6px}
#time{flex-basis:100%;color:var(--muted);border-style:dashed}
li span{font-family:var(--display);color:var(--seal)}
</style>

<main class="slip">
  <section class="final" aria-live="polite">
    <article class="insta" aria-label="오늘의 운세 카드">
      <span class="ig-sample" id="sampleTag">예시 카드 · 생년월일을 넣고 운세를 뽑아 보세요</span>
      <header class="ig-top">
        <div class="ig-num"><small>행운의 숫자</small><div class="final-num" id="final">–</div></div>
        <div class="ig-who"><span class="ig-name">오늘의 운세<small id="igDate">행운 번호</small></span><span class="ig-avatar" aria-hidden="true">運</span></div>
      </header>
      <div class="ig-body">
        <div class="reading" id="todayReading"></div>
      </div>
      <p class="ig-msg">오늘 하루 행운의 물건을 가까이 두고,<br>오늘의 운세를 떠올리며 긍정적인 하루 보내세요!</p>
      <footer class="ig-foot"><span>#오늘의운세 #행운번호</span><span id="igTime"></span></footer>
    </article>
    <div class="share" aria-label="카드 공유">
      <div class="share-btns">
        <button type="button" id="saveCard">카드 이미지 저장</button>
        <button type="button" id="copyText" class="ghost">공유 문구 복사</button>
      </div>
      <p class="share-msg" id="shareMsg" role="status"></p>
      <textarea id="shareFallback" readonly hidden></textarea>
      <figure class="share-preview" id="sharePreview" hidden>
        <img id="sharePreviewImg" alt="운세 카드 이미지">
        <figcaption>이미지를 길게 누르거나 마우스 오른쪽 버튼으로 저장한 뒤 인스타·카톡·블로그에 올려 보세요.</figcaption>
      </figure>
    </div>
  </section>
  <h1>오늘의 운세 번호</h1>
  <p class="sub">생년월일과 오늘 날짜로 뽑는 세 자리 숫자</p>

  <form id="f" novalidate>
    <label for="birth">생년월일 (예: 1994.11.26)</label>
    <input id="birth" inputmode="numeric" autocomplete="bday" placeholder="YYYY.MM.DD" value="" maxlength="10">
    <label for="time">입력 시각</label>
    <input id="time" readonly tabindex="-1" value="--:--">
    <button type="submit" style="width:100%">운세 보기 · 새로고침</button>
    <p class="err" id="err" hidden></p>
  </form>

  <section class="result" id="result" aria-live="polite">
    <p class="tag" id="birthTag">생년월일 번호</p>
    <div class="digits" id="digits"></div>
    <p class="tag" id="minTag">분 단위 번호</p>
    <div class="digits" id="minDigits"></div>
    <p class="tag" id="secTag">초 단위 번호</p>
    <div class="digits" id="secDigits"></div>
  </section>

</main>

<script>


// 숫자 그림: 일상에서 자주 보는 물건, 모양이나 개수가 숫자와 닮은 것으로 골랐다
const K="#2a1f14";
const ICONS=[
 {name:"도넛",svg:`<circle cx="32" cy="32" r="24" fill="#e2b06a" stroke="${K}" stroke-width="2"/><circle cx="32" cy="32" r="20" fill="#ec8fb0"/><circle cx="32" cy="32" r="8" fill="#e2b06a" stroke="${K}" stroke-width="2"/><circle cx="32" cy="32" r="5.5" fill="var(--card)"/><g stroke-width="2.5" stroke-linecap="round"><path d="M20 22l3 2" stroke="#fff"/><path d="M42 20l-2 3" stroke="#f2c230"/><path d="M46 36l-3 1" stroke="#5fb3e8"/><path d="M22 42l2-3" stroke="#f2c230"/><path d="M33 46l3 1" stroke="#fff"/><path d="M18 33l1 3" stroke="#5fb3e8"/></g>`},
 {name:"연필",svg:`<rect x="26" y="4" width="12" height="7" rx="2" fill="#ec8fb0" stroke="${K}" stroke-width="2"/><rect x="26" y="11" width="12" height="4" fill="#b9b9b9" stroke="${K}" stroke-width="2"/><rect x="26" y="15" width="12" height="29" fill="#f2c230" stroke="${K}" stroke-width="2"/><path d="M26 44h12l-6 15z" fill="#efd3a8" stroke="${K}" stroke-width="2" stroke-linejoin="round"/><path d="M30 54h4l-2 5z" fill="${K}"/>`},
 {name:"젓가락",svg:`<g stroke-linecap="round"><path d="M22 5l9 54" stroke="${K}" stroke-width="7"/><path d="M22 5l9 54" stroke="#c78a4e" stroke-width="4"/><path d="M42 5l-9 54" stroke="${K}" stroke-width="7"/><path d="M42 5l-9 54" stroke="#c78a4e" stroke-width="4"/></g>`},
 {name:"신호등",svg:`<rect x="19" y="4" width="26" height="54" rx="7" fill="#3a3f45" stroke="${K}" stroke-width="2"/><circle cx="32" cy="16" r="6.5" fill="#e2463a"/><circle cx="32" cy="31" r="6.5" fill="#f2c230"/><circle cx="32" cy="46" r="6.5" fill="#3cb371"/>`},
 {name:"네잎클로버",svg:`<path d="M32 36q4 14 12 22" fill="none" stroke="#2f7d45" stroke-width="3" stroke-linecap="round"/><g fill="#4caf6a" stroke="${K}" stroke-width="2"><circle cx="23" cy="23" r="10"/><circle cx="41" cy="23" r="10"/><circle cx="23" cy="41" r="10"/><circle cx="41" cy="41" r="10"/></g><circle cx="32" cy="32" r="3" fill="#2f7d45"/>`},
 {name:"손바닥",svg:`<g fill="#f1c9a5" stroke="${K}" stroke-width="2"><rect x="18" y="13" width="7" height="24" rx="3.5"/><rect x="26" y="7" width="7" height="28" rx="3.5"/><rect x="34" y="8" width="7" height="28" rx="3.5"/><rect x="42" y="14" width="7" height="24" rx="3.5"/><rect x="7" y="31" width="7" height="20" rx="3.5" transform="rotate(-40 10.5 41)"/><rect x="17" y="28" width="32" height="30" rx="12"/></g><path d="M20 30h28" stroke="#f1c9a5" stroke-width="3"/>`},
 {name:"주사위",svg:`<rect x="8" y="8" width="48" height="48" rx="10" fill="#fff" stroke="${K}" stroke-width="2.5"/><g fill="${K}"><circle cx="21" cy="20" r="4.5"/><circle cx="21" cy="32" r="4.5"/><circle cx="21" cy="44" r="4.5"/><circle cx="43" cy="20" r="4.5"/><circle cx="43" cy="32" r="4.5"/><circle cx="43" cy="44" r="4.5"/></g>`},
 {name:"무지개",svg:`<g fill="none" stroke-width="3.2">${["#e2463a","#f08a2b","#f2c230","#3cb371","#3b8fd9","#3f4fb0","#8a4fb8"].map((c,i)=>{const r=27-i*3.2;return `<path d="M${32-r} 50A${r} ${r} 0 0 1 ${32+r} 50" stroke="${c}"/>`}).join("")}</g><g fill="#fff" stroke="${K}" stroke-width="1.5"><ellipse cx="9" cy="51" rx="7" ry="5"/><ellipse cx="55" cy="51" rx="7" ry="5"/></g>`},
 {name:"안경",svg:`<path d="M8 28L3 22M56 28l5-6" stroke="${K}" stroke-width="3" stroke-linecap="round"/><g fill="#cfe6f5" stroke="${K}" stroke-width="3.5"><circle cx="20" cy="34" r="12"/><circle cx="44" cy="34" r="12"/></g><path d="M30 31q2-4 4 0" fill="none" stroke="${K}" stroke-width="3"/><path d="M14 30q3-4 7-4M38 30q3-4 7-4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>`},
 {name:"야구공",svg:`<circle cx="32" cy="32" r="25" fill="#fff" stroke="${K}" stroke-width="2.5"/><g fill="none" stroke="#d0342c" stroke-width="2"><path d="M17 12q12 20 0 40"/><path d="M47 12q-12 20 0 40"/><path d="M17 12q12 20 0 40" stroke-dasharray="1 4" stroke-width="6" transform="translate(2.5 0)"/><path d="M47 12q-12 20 0 40" stroke-dasharray="1 4" stroke-width="6" transform="translate(-2.5 0)"/></g>`}
];
function card(c,cls,style){
  const ic=ICONS[+c];
  return `<div class="${cls}"${style||""} title="${c} ${ic.name}"><svg viewBox="0 0 64 64" aria-hidden="true">${ic.svg}</svg><span class="cap"><b>${c}</b>${ic.name}</span></div>`;
}

// 0~999 번호마다 따로 쓴 운세 [제목, 풀이]

말을 차분히 전하세요."], ["혼자가 편한 날", "오늘은 혼자 보내는 시간이 마음을 채워 줍니다. 조용한 산책을 권합니다."], ["든든한 식사의 날", "잘 먹는 것이 오늘의 행운입니다. 제철 음식을 챙겨 드세요."], ["인정받는 날", "맡은 일에서 좋은 평가를 받습니다. 노력한 만큼 돌아오는 날입니다."], ["조금 더 기다리는 날", "원하는 결과가 바로 오지 않아도 괜찮습니다. 방향은 맞습니다."], ["정리 정돈의 날", "주변을 정리하면 일이 빨라집니다. 쓰지 않는 물건은 과감히 비우세요."], ["새 인연의 날", "새로운 사람과의 만남이 즐겁습니다. 연락처를 꼭 받아 두세요."], ["아끼는 물건을 챙기는 날", "소지품을 잘 챙기세요. 우산이나 지갑을 두고 오지 않게 조심하세요."], ["하나씩 끝내는 날", "여러 일을 동시에 하기보다 하나씩 끝내세요. 끝낼 때마다 개운합니다."], ["조용한 충전의 날", "몸과 마음을 충전하는 날입니다. 휴대폰을 잠시 내려놓으세요."], ["생각이 정리되는 날", "복잡했던 고민이 하나로 모입니다. 결론을 종이에 적어 두세요."], ["복이 들어오는 날", "집안에 좋은 기운이 감돕니다. 가족과 함께 저녁을 드세요."], ["작은 칭찬의 날", "누군가 나를 좋게 봐 줍니다. 쑥스러워하지 말고 고맙게 받으세요."], ["꾸준히 나아가는 날", "어제보다 조금 나아진 하루입니다. 그거면 충분합니다."], ["좋은 타이밍의 날", "하려던 일이 딱 좋은 때를 만납니다. 망설이지 말고 실행하세요."], ["조금 피곤한 날", "평소보다 쉽게 지칩니다. 중간중간 스트레칭으로 몸을 풀어 주세요."], ["소통이 잘 되는 날", "메시지가 오해 없이 잘 전달됩니다. 미뤄 둔 연락을 하세요."], ["최고의 순간이 오는 날", "기다리던 좋은 소식이 드디어 찾아옵니다. 오늘을 오래 기억하게 됩니다."], ["가볍게 넘기는 날", "사소한 일에 마음 쓰지 마세요. 웃어넘기면 금방 지나갑니다."], ["안정적인 하루의 날", "흔들림 없이 차분하게 하루를 보냅니다. 루틴을 지키세요."], ["속도를 줄이는 날", "빨리 가려다 넘어질 수 있습니다. 오늘은 천천히, 확실하게 가세요."], ["즐거운 준비의 날", "다가올 일을 준비하는 과정이 즐겁습니다. 미리 챙기면 여유가 생깁니다."], ["행복한 소식의 날", "가까운 사람에게 기쁜 일이 생깁니다. 진심으로 축하해 주세요."], ["소소한 이득의 날", "할인이나 덤처럼 작은 이득이 생깁니다. 영수증을 잘 챙기세요."], ["성실한 하루의 날", "맡은 일을 꼼꼼히 하면 실수가 없습니다. 오늘은 꼼꼼함이 무기입니다."], ["빛나는 아이디어의 날", "번뜩이는 생각이 떠오릅니다. 바로 메모해 두면 쓸 곳이 생깁니다."], ["잠깐 멈춤의 날", "일이 잠시 멈춰도 걱정하지 마세요. 숨을 고르는 시간입니다."], ["편안한 만남의 날", "오랜 친구와의 만남이 편안합니다. 부담 없는 대화가 힘이 됩니다."], ["기본에 충실한 날", "오늘은 특별한 것보다 기본을 지키는 것이 중요합니다. 끼니를 거르지 마세요."], ["조금씩 가까워지는 날", "목표에 한 걸음 더 다가갑니다. 오늘의 작은 진전을 칭찬해 주세요."], ["마음이 따뜻한 날", "주변의 배려가 느껴집니다. 받은 만큼 따뜻하게 돌려주세요."], ["작은 변화의 날", "일상에 작은 변화를 주면 기분이 달라집니다. 다른 길로 걸어 보세요."], ["매듭짓는 날", "미뤄 둔 일을 깔끔하게 마무리합니다. 끝내고 나면 홀가분합니다."], ["첫 단추가 잘 끼워지는 날", "아침에 시작한 일이 하루 내내 순조롭습니다. 출근길에 좋은 노래를 들어 보세요."], ["우산을 챙기는 날", "대비해 두면 걱정할 일이 없습니다. 작은 준비가 하루를 지켜 줍니다."], ["조용히 집중하는 날", "소음에서 벗어나면 일이 잘 됩니다. 이어폰을 끼고 한 가지에 몰두하세요."], ["기다리는 법을 배우는 날", "오늘은 답이 오지 않아도 괜찮습니다. 조급함을 내려놓는 연습을 해 보세요."], ["살짝 돌아가는 날", "지름길보다 돌아가는 길이 안전합니다. 덕분에 새로운 가게를 발견합니다."], ["손에 익는 날", "처음엔 낯설던 일이 오늘은 손에 익습니다. 반복이 실력이 됩니다."], ["감정을 다독이는 날", "작은 일에 마음이 흔들릴 수 있습니다. 깊게 숨을 쉬고 한 번 더 생각하세요."], ["무난한 거래의 날", "사고팔 일이 있다면 무난하게 성사됩니다. 가격 비교는 한 번만 더 하세요."], ["반가운 얼굴의 날", "오래 못 본 사람과 우연히 마주칩니다. 짧게라도 안부를 나누세요."], ["조금 늦어도 되는 날", "약속이 살짝 밀려도 좋은 결과가 납니다. 미리 연락만 해 두세요."], ["생활이 정돈되는 날", "흐트러졌던 생활 리듬이 돌아옵니다. 같은 시간에 일어나 보세요."], ["하늘이 돕는 날", "막혔던 일이 거짓말처럼 풀립니다. 오늘 내린 결정은 오래도록 좋은 결과를 냅니다."], ["작은 행운을 줍는 날", "길에서 반가운 것을 발견합니다. 고개를 들고 주변을 살피며 걸으세요."], ["차분한 오후의 날", "오후로 갈수록 마음이 차분해집니다. 어려운 일은 오후에 하세요."], ["가볍게 지나가는 날", "큰 기대 없이 보내면 오히려 편합니다. 좋아하는 간식으로 기분을 챙기세요."], ["대화로 푸는 날", "오해가 있었다면 대화로 쉽게 풀립니다. 먼저 말을 거는 쪽이 편해집니다."], ["재능이 드러나는 날", "숨겨 둔 재주가 사람들 앞에서 빛납니다. 부탁받으면 기꺼이 나서세요."], ["아끼면 이득인 날", "오늘은 쓰는 것보다 모으는 쪽이 유리합니다. 가계부를 써 보세요."], ["어제보다 나은 날", "어제의 고민이 오늘은 가볍게 느껴집니다. 한결 나아진 나를 믿으세요."], ["칭찬이 쏟아지는 날", "한 일마다 좋은 반응을 얻습니다. 오늘의 칭찬을 기억해 두세요."], ["느긋하게 가는 날", "조금 느려도 결국 도착합니다. 오늘은 여유를 갖는 것이 이득입니다."], ["소박한 즐거움의 날", "집 근처에서 즐거움을 찾습니다. 동네 산책이 기분을 바꿔 줍니다."], ["주의가 필요한 날", "서류나 숫자를 다룰 때 한 번 더 확인하세요. 작은 실수만 막으면 무난합니다."], ["마음이 살짝 들뜨는 날", "들뜬 마음은 좋지만 약속은 꼼꼼히 챙기세요. 메모가 도와줍니다."], ["기대 이상의 날", "생각보다 결과가 좋습니다. 스스로에게 작은 상을 주세요."], ["천천히 움직이는 날", "몸이 무겁게 느껴지면 억지로 서두르지 마세요. 따뜻한 물로 샤워하면 개운합니다."], ["하나를 얻는 날", "작지만 확실한 하나를 얻습니다. 욕심을 줄이면 만족이 커집니다."], ["협력이 빛나는 날", "함께 일하는 사람들과 호흡이 척척 맞습니다. 팀으로 움직이면 성과가 큽니다."], ["조금 서툰 날", "손에 잘 안 잡혀도 괜찮습니다. 내일이면 다시 감이 돌아옵니다."], ["일상의 리듬을 찾는 날", "평소의 리듬대로 움직이면 편합니다. 무리한 변화는 다음으로 미루세요."], ["모두가 반기는 날", "가는 곳마다 환영받습니다. 오늘 만나는 사람과 좋은 인연이 이어집니다."], ["조심스러운 지출의 날", "꼭 필요한 것만 사세요. 사고 싶은 것은 하루 지나 다시 생각하세요."], ["머리가 맑은 날", "생각이 또렷해 판단이 정확합니다. 미뤄 둔 결정을 내리기 좋습니다."], ["휴식이 답인 날", "해야 할 일보다 쉬는 것이 우선입니다. 오늘 푹 쉬면 내일이 달라집니다."], ["약간의 행운이 있는 날", "사소한 일에서 운이 따릅니다. 신호등이 연달아 초록불일지 모릅니다."], ["원하는 것을 얻는 날", "바라던 것을 손에 넣게 됩니다. 감사한 마음을 잊지 마세요."], ["작은 갈림길의 날", "두 길 사이에서 고민된다면 더 단순한 쪽을 고르세요."], ["정직함이 통하는 날", "솔직하게 말하면 상대도 마음을 엽니다. 꾸미지 않는 것이 좋습니다."], ["기쁜 만남의 날", "약속 자리에 좋은 사람이 함께합니다. 대화가 즐겁게 이어집니다."], ["살짝 지치는 날", "중간에 쉬는 시간을 꼭 가지세요. 달콤한 간식이 힘이 됩니다."], ["무리 없이 흘러가는 날", "오늘은 흐름에 맡겨도 괜찮습니다. 억지로 바꾸려 하지 마세요."], ["말조심의 날", "무심코 한 말이 오래 남을 수 있습니다. 칭찬은 크게, 불평은 작게 하세요."], ["작은 보람의 날", "남을 도운 일이 작은 보람으로 돌아옵니다. 그 기분을 오래 간직하세요."], ["기세가 오르는 날", "하는 일마다 탄력이 붙습니다. 오늘은 조금 욕심을 내도 좋습니다."], ["느슨해도 되는 날", "오늘은 완벽하지 않아도 괜찮습니다. 반만 해도 충분하다고 생각하세요."], ["정성 어린 하루의 날", "작은 일에도 정성을 들이면 결과가 좋습니다. 대충은 금물입니다."], ["좋은 제안의 날", "솔깃한 제안이 들어옵니다. 조건을 잘 살피면 좋은 기회가 됩니다."], ["짧게 끝내는 날", "회의나 통화는 짧게 하세요. 길어질수록 결론이 흐려집니다."], ["나를 돌보는 날", "나에게 필요한 것이 무엇인지 생각해 보세요. 작은 선물을 해도 좋습니다."], ["꿈이 가까워지는 날", "오래 바라던 목표에 크게 다가섭니다. 오늘은 과감하게 움직이세요."], ["실속을 챙기는 날", "겉보다 속이 중요합니다. 화려한 것보다 쓸모 있는 것을 고르세요."], ["무사히 넘기는 날", "걱정했던 일이 무사히 지나갑니다. 안도의 한숨을 쉬어도 좋습니다."], ["기운을 아끼는 날", "에너지가 금방 떨어질 수 있습니다. 중요한 일은 오전에 끝내세요."], ["순하게 풀리는 날", "억지로 밀어붙이지 않아도 일이 풀립니다. 힘을 빼면 더 잘 됩니다."], ["다정함이 돌아오는 날", "베푼 친절이 몇 배로 돌아옵니다. 오늘도 다정하게 대하세요."], ["조금 엇갈리는 날", "약속이나 일정이 살짝 어긋날 수 있습니다. 미리 확인 연락을 하세요."], ["편안한 집의 날", "집에 있는 시간이 유난히 편합니다. 좋아하는 영화를 한 편 보세요."], ["좋은 일이 겹치는 날", "반가운 일이 연달아 생깁니다. 웃는 얼굴이 행운을 더 부릅니다."], ["소박한 만족의 날", "가진 것에 만족하면 마음이 넉넉합니다. 비교는 잠시 멈추세요."], ["흐름을 타는 날", "주변 분위기에 맞춰 움직이면 편합니다. 혼자 튀지 않아도 됩니다."], ["조용히 지켜보는 날", "나서기보다 지켜보는 편이 낫습니다. 상황을 파악하면 내일 유리합니다."], ["손님이 오는 날", "반가운 연락이나 방문이 있습니다. 차 한 잔 대접할 준비를 해 두세요."], ["자신을 믿는 날", "스스로를 믿으면 결과가 따라옵니다. 오늘은 내 판단이 옳습니다."], ["휴대폰을 내려놓는 날", "화면을 덜 볼수록 마음이 편해집니다. 잠들기 한 시간 전엔 쉬게 해 주세요."], ["작은 성공의 날", "작은 목표를 이루며 자신감이 붙습니다. 오늘 이룬 것을 적어 보세요."], ["뜻이 통하는 날", "말하지 않아도 상대가 내 마음을 압니다. 좋은 사람이 곁에 있습니다."], ["살짝 비켜 가는 날", "원하던 것이 조금 비켜 가도 더 나은 것이 기다립니다. 아쉬워 마세요."], ["부지런함이 이기는 날", "조금 일찍 일어나면 하루가 길어집니다. 아침 시간을 활용하세요."], ["행운이 손짓하는 날", "복권 한 장의 설렘처럼 기분 좋은 일이 생깁니다. 오늘의 직감을 믿으세요."], ["사소한 일에 웃는 날", "작은 해프닝이 웃음을 줍니다. 심각하게 받아들이지 마세요."], ["건강을 챙기는 날", "가벼운 운동이 몸을 개운하게 합니다. 엘리베이터 대신 계단을 이용해 보세요."], ["일찍 마무리하는 날", "오늘은 일을 늘리지 말고 일찍 마무리하세요. 저녁이 여유로워집니다."], ["꾸밈없는 하루의 날", "있는 그대로의 모습이 가장 좋습니다. 편한 옷차림이 행운을 부릅니다."], ["좋은 소식이 오는 날", "기다리던 연락이 좋은 내용으로 옵니다. 휴대폰을 가까이 두세요."], ["한 번 더 묻는 날", "헷갈리는 것은 바로 물어보세요. 아는 척하면 일이 꼬입니다."], ["든든한 하루의 날", "든든하게 아침을 먹으면 하루가 순조롭습니다. 아침을 거르지 마세요."], ["기다림이 보답받는 날", "오래 기다린 일이 좋은 결과로 나타납니다. 참은 보람이 있습니다."], ["작게 시작하는 날", "큰 계획보다 작은 첫걸음이 중요합니다. 오늘은 5분만 투자하세요."], ["조화로운 하루의 날", "사람들과의 관계가 부드럽습니다. 양보 하나가 분위기를 좋게 만듭니다."], ["조심해서 나쁠 것 없는 날", "평소보다 조심하면 무사히 지나갑니다. 문단속과 불단속을 확인하세요."], ["숨 고르는 오후의 날", "바쁜 오전이 지나면 숨 돌릴 틈이 생깁니다. 그 틈에 따뜻한 차를 마시세요."], ["행운의 연락이 오는 날", "뜻밖의 연락이 좋은 기회를 가져옵니다. 모르는 번호도 한 번은 받아 보세요."], ["조금 서두르는 날", "조금 일찍 출발하면 여유가 생깁니다. 5분 먼저 나서세요."], ["생각이 자라는 날", "읽고 듣는 것이 생각을 넓혀 줍니다. 좋은 글 한 편을 찾아 읽어 보세요."], ["웃음꽃이 피는 날", "가족이나 친구와 웃을 일이 많습니다. 함께하는 시간을 늘리세요."], ["조금 아쉬운 결과의 날", "기대에 못 미쳐도 배운 것이 있습니다. 다음에는 더 잘할 수 있습니다."], ["순조로운 이동의 날", "이동하는 길이 막힘없이 편안합니다. 가까운 곳으로 바람 쐬러 가 보세요."], ["생각을 비우는 날", "머리를 비우는 시간이 필요합니다. 멍하니 하늘을 보는 것도 괜찮습니다."], ["아껴 둔 것을 꺼내는 날", "아껴 둔 물건을 꺼내 쓰면 기분이 좋아집니다. 오늘이 그날입니다."], ["정리된 마음의 날", "어지럽던 감정이 정리됩니다. 일기를 쓰면 더 또렷해집니다."], ["평범함이 고마운 날", "아무 일 없는 하루가 가장 큰 복입니다. 평범함에 감사해 보세요."], ["가까운 사람의 날", "가까운 사람의 말에 귀 기울이세요. 오늘 들은 조언이 길잡이가 됩니다."], ["노력이 열매 맺는 날", "그동안의 노력이 눈에 보이는 결과로 나옵니다. 스스로를 칭찬하세요."], ["살짝 피해 가는 날", "복잡한 자리는 피하는 것이 좋습니다. 조용한 곳에서 일하세요."], ["안정된 재물의 날", "돈 문제가 무리 없이 해결됩니다. 정기적인 지출을 점검해 보세요."], ["최고의 날", "오늘은 모든 것이 맞아떨어집니다. 하고 싶었던 일을 마음껏 해 보세요."], ["작은 휴식의 날", "틈틈이 쉬어야 오래 갑니다. 한 시간마다 자리에서 일어나세요."], ["평온한 마음의 날", "걱정이 줄고 마음이 편해집니다. 지금의 평온을 즐기세요."], ["다음을 준비하는 날", "오늘보다 내일을 위해 준비하는 날입니다. 내일 입을 옷을 미리 골라 두세요."], ["무난한 성과의 날", "크게 튀지 않아도 할 일은 다 해냅니다. 그것만으로 잘한 하루입니다."], ["두 손 가득한 날", "챙길 것이 많지만 모두 좋은 일입니다. 바쁜 만큼 보람도 큽니다."], ["조심스러운 출발의 날", "첫걸음은 천천히 떼세요. 준비물을 다시 확인하면 걱정이 없습니다."], ["차곡차곡 정리하는 날", "쌓인 일을 하나씩 정리하면 마음이 가벼워집니다. 메일함부터 비워 보세요."], ["짝꿍운이 좋은 날", "함께하는 사람과 손발이 척척 맞습니다. 둘이 하면 두 배로 빨라집니다."], ["작은 오해를 푸는 날", "사소한 오해는 바로 풀어야 커지지 않습니다. 짧은 메시지 하나면 충분합니다."], ["평소처럼 좋은 날", "특별할 것 없이 평소처럼 흘러갑니다. 익숙한 일상이 주는 안정감을 누리세요."], ["조용히 지내는 날", "사람 많은 곳보다 조용한 곳이 맞는 날입니다. 혼자만의 시간을 가지세요."], ["살짝 미뤄지는 날", "계획이 조금 미뤄져도 결과는 괜찮습니다. 남는 시간을 나를 위해 쓰세요."], ["도움이 닿는 날", "필요할 때 꼭 맞는 도움이 찾아옵니다. 부탁하는 것을 망설이지 마세요."], ["무리한 약속을 피하는 날", "지키기 어려운 약속은 하지 마세요. 거절도 예의 있게 하면 괜찮습니다."], ["밥심으로 버티는 날", "든든한 한 끼가 오늘의 힘입니다. 좋아하는 메뉴로 점심을 드세요."], ["센스가 빛나는 날", "순간의 재치가 분위기를 살립니다. 오늘은 내 아이디어가 환영받습니다."], ["조금 흐린 날", "기분이 살짝 가라앉아도 오후엔 갭니다. 밝은 색 옷이 도움이 됩니다."], ["약속을 지키는 날", "내가 한 말을 지키면 신뢰가 쌓입니다. 작은 약속부터 챙기세요."], ["대박이 터지는 날", "기대 이상의 성과가 나옵니다. 오늘의 좋은 기운을 놓치지 마세요."], ["조금씩 채우는 날", "한꺼번에 채우려 하지 말고 조금씩 채우세요. 꾸준함이 이깁니다."], ["흐름이 부드러운 날", "대화도 일도 부드럽게 흘러갑니다. 오늘은 갈등이 생기지 않습니다."], ["에너지를 아끼는 날", "하루를 길게 보고 힘을 나눠 쓰세요. 저녁에 쓸 힘을 남겨 두면 좋습니다."], ["쓸모 있는 하루의 날", "오늘 한 일이 다음 주에 쓸모가 있습니다. 대충 넘기지 마세요."], ["좋은 바람이 부는 날", "새로운 소식이 기분 좋은 변화를 가져옵니다. 열린 마음으로 받아들이세요."], ["한숨 돌리는 날", "급한 불은 껐으니 잠시 쉬어도 됩니다. 쉬는 것도 일의 일부입니다."], ["정직한 노력의 날", "요령보다 정직한 노력이 통합니다. 기본을 지키면 결과가 따라옵니다."], ["두근거리는 날", "설레는 일이 기다리고 있습니다. 평소보다 조금 더 꾸미고 나가세요."], ["살짝 엇박자의 날", "타이밍이 조금씩 어긋나도 크게 문제 되지 않습니다. 웃어넘기세요."], ["편안한 동행의 날", "함께 걷는 사람이 있어 든든합니다. 가까운 사람과 산책해 보세요."], ["천천히 생각하는 날", "즉답보다 생각할 시간을 달라고 하세요. 하룻밤 자고 나면 답이 보입니다."], ["작은 물건을 챙기는 날", "자잘한 소지품을 잃어버리기 쉽습니다. 나가기 전에 주머니를 확인하세요."], ["복이 굴러오는 날", "가만히 있어도 좋은 일이 찾아옵니다. 오늘은 운을 믿어도 좋습니다."], ["가볍게 비우는 날", "무거운 마음을 내려놓는 날입니다. 걱정 목록을 적고 덮어 두세요."], ["성실히 채우는 날", "빈 곳을 하나씩 채우며 완성에 가까워집니다. 오늘도 한 칸을 채우세요."], ["칭찬받을 일이 생기는 날", "사소한 행동이 칭찬으로 돌아옵니다. 평소의 배려가 빛을 봅니다."], ["조금 느린 답장의 날", "답장이 늦어도 걱정하지 마세요. 상대도 바쁠 뿐입니다."], ["좋은 습관의 날", "좋은 습관 하나를 시작하기 좋습니다. 물 한 잔으로 아침을 여세요."], ["행운의 신호등이 켜지는 날", "가는 곳마다 길이 열립니다. 망설이던 일에 초록불이 켜졌습니다."], ["아쉬운 만큼 배우는 날", "아쉬움 속에 배울 점이 있습니다. 오늘의 경험을 기록해 두세요."], ["순서대로 되는 날", "차례를 기다리면 내 몫이 옵니다. 새치기하지 않아도 괜찮습니다."], ["감기를 조심하는 날", "몸이 쉽게 지칠 수 있습니다. 따뜻하게 입고 물을 자주 드세요."], ["하나씩 확인하는 날", "체크리스트를 쓰면 빠뜨리는 것이 없습니다. 오늘은 꼼꼼함이 행운입니다."], ["사랑받는 날", "주변에서 따뜻한 관심을 받습니다. 받은 사랑을 표현으로 돌려주세요."], ["작은 고비를 넘는 날", "살짝 힘든 순간이 있지만 금방 넘어갑니다. 오후에는 한결 편해집니다."], ["소통의 날", "대화가 많을수록 일이 잘 풀립니다. 혼자 판단하기보다 의견을 물어보세요."], ["기회를 잡는 날", "눈앞에 온 기회를 잡으면 좋은 결과가 납니다. 오늘은 손을 들어 보세요."], ["조금 조심스러운 날", "새로운 시도는 작게 해 보세요. 반응을 보고 키워도 늦지 않습니다."], ["여유가 생기는 날", "생각보다 일이 빨리 끝나 여유가 생깁니다. 그 시간에 좋아하는 일을 하세요."], ["조용한 마무리의 날", "하루를 조용히 마무리하는 것이 좋습니다. 일찍 불을 끄고 쉬세요."], ["담담하게 가는 날", "감정에 휘둘리지 않고 담담하게 일을 처리합니다. 오늘은 침착함이 힘입니다."], ["발이 넓어지는 날", "새로운 사람을 많이 알게 됩니다. 명함이나 연락처를 잘 챙기세요."], ["기대를 줄이는 날", "기대를 줄이면 작은 일에도 기쁩니다. 오늘은 소박하게 보내세요."], ["집안이 평안한 날", "집안에 큰 일 없이 평안합니다. 가족과 저녁을 함께하면 더 좋습니다."], ["새 출발의 날", "새로 시작하는 일에 좋은 기운이 깃듭니다. 오늘 시작한 일은 오래 갑니다."], ["조금 버거운 날", "일이 몰려도 하나씩 하면 끝납니다. 우선순위를 정하세요."], ["무난한 만남의 날", "약속 자리가 편안하게 흘러갑니다. 대화의 주인공보다 듣는 쪽이 되세요."], ["풍요로운 날", "재물과 기쁨이 함께 들어옵니다. 오늘 생긴 여유를 소중히 쓰세요."], ["작은 지출이 생기는 날", "예상 못 한 작은 지출이 있습니다. 비상금이 있다면 걱정 없습니다."], ["매일이 쌓이는 날", "오늘 하루도 내일을 위한 디딤돌이 됩니다. 꾸준히 하던 일을 하세요."], ["쉬어 가도 괜찮은 날", "오늘은 성과보다 휴식이 중요합니다. 낮잠도 좋은 선택입니다."], ["정해진 길을 가는 날", "새 길을 찾기보다 정해진 길을 가는 것이 좋습니다. 계획표를 따르세요."], ["좋은 결과가 나오는 날", "결과를 기다리던 일이 좋게 나옵니다. 축하받을 준비를 하세요."], ["살짝 바쁜 날", "정신없이 바빠도 큰 문제는 없습니다. 점심은 꼭 챙겨 드세요."], ["함께 웃는 날", "사소한 이야기로 함께 웃게 됩니다. 웃음이 하루의 피로를 풀어 줍니다."], ["자랑할 일이 생기는 날", "기분 좋은 일이 생겨 자랑하고 싶어집니다. 가까운 사람과 나누세요."], ["한 템포 늦추는 날", "말하기 전에 한 번 더 생각하세요. 한 템포 늦추면 실수가 줄어듭니다."], ["무난한 공부의 날", "공부나 일이 막힘없이 진행됩니다. 오늘 정한 분량은 끝낼 수 있습니다."], ["휴식을 예약하는 날", "오늘은 일정 사이에 쉬는 시간을 꼭 넣으세요. 빽빽한 일정은 피하세요."], ["안부가 오가는 날", "짧은 안부 인사가 관계를 따뜻하게 합니다. 생각나는 사람에게 연락하세요."], ["운이 트이는 날", "막혀 있던 운이 서서히 트입니다. 오늘부터 좋은 흐름이 시작됩니다."], ["조금 신경 쓰이는 날", "사소한 일이 신경 쓰여도 금방 잊힙니다. 마음에 담아 두지 마세요."], ["든든한 동료의 날", "믿을 수 있는 동료가 곁에 있습니다. 일을 나누면 훨씬 수월합니다."], ["원하는 답을 듣는 날", "기다리던 대답이 원하던 대로 옵니다. 오늘은 물어보면 좋습니다."], ["소박한 저녁의 날", "거창한 계획보다 소박한 저녁이 행복합니다. 집밥을 드세요."], ["부드러운 하루의 날", "말투를 부드럽게 하면 모든 일이 매끄럽습니다. 오늘은 존댓말이 좋습니다."], ["별이 빛나는 날", "나의 장점이 가장 빛나는 날입니다. 사람들 앞에 나설 일이 있다면 오늘입니다."], ["조금 돌아보는 날", "지난 일을 돌아보면 배울 점이 보입니다. 같은 실수만 피하면 됩니다."], ["한 걸음씩 가는 날", "큰 걸음보다 확실한 한 걸음이 중요합니다. 오늘의 한 걸음을 내딛으세요."], ["평정을 지키는 날", "감정이 흔들려도 평정을 지키면 무사히 지나갑니다. 심호흡을 해 보세요."], ["생활이 편해지는 날", "불편했던 것을 하나 고치면 생활이 편해집니다. 미뤄 둔 수리를 하세요."], ["마음이 맞는 날", "생각이 비슷한 사람을 만나 힘을 얻습니다. 함께 계획을 세워 보세요."], ["작게 아끼는 날", "불필요한 구독이나 지출을 정리해 보세요. 작은 절약이 쌓입니다."], ["맑은 정신의 날", "머리가 맑아 실수가 적습니다. 꼼꼼함이 필요한 일을 하세요."], ["기쁨이 넘치는 날", "웃을 일이 연달아 생깁니다. 오늘은 좋은 기운이 사방에서 모입니다."], ["살짝 서운한 날", "작은 일에 서운할 수 있지만 상대에게 악의는 없습니다. 너그럽게 넘기세요."], ["준비가 통하는 날", "미리 준비한 것이 그대로 쓰입니다. 준비한 만큼 여유롭습니다."], ["일정을 줄이는 날", "일정을 줄이면 마음이 편해집니다. 오늘은 꼭 필요한 약속만 지키세요."], ["좋은 습관이 돕는 날", "평소 습관이 오늘 나를 돕습니다. 정리하는 습관이 특히 빛납니다."], ["좋은 사람을 만나는 날", "만나는 사람마다 친절합니다. 오늘 만난 인연을 소중히 하세요."], ["살짝 피곤한 오후의 날", "오후에 졸음이 올 수 있습니다. 짧은 산책으로 기분을 바꾸세요."], ["순하게 마무리하는 날", "하루를 큰 탈 없이 마무리합니다. 잠들기 전에 내일 할 일을 적어 두세요."], ["마음이 넉넉한 날", "여유가 생겨 남에게 베풀 수 있습니다. 베푼 만큼 복이 돌아옵니다."], ["조금 망설이는 날", "결정하기 어렵다면 하루 미뤄도 괜찮습니다. 급할수록 돌아가세요."], ["평범한 기쁨의 날", "평범한 일상 속에서 기쁨을 찾습니다. 맛있는 커피 한 잔이면 충분합니다."], ["안전이 우선인 날", "이동할 때 평소보다 조심하세요. 서두르지 않으면 아무 일도 없습니다."], ["작은 실수를 웃는 날", "작은 실수가 있어도 웃으며 넘기면 괜찮습니다. 아무도 크게 신경 쓰지 않습니다."], ["정리가 잘 되는 날", "생각과 물건이 함께 정리됩니다. 옷장 한 칸을 정리해 보세요."], ["조용한 하루를 고르는 날", "오늘은 화려함보다 조용함을 고르세요. 집에서 보내는 시간이 좋습니다."], ["성과가 보이는 날", "작지만 분명한 성과가 보입니다. 그 성과를 기록해 두세요."], ["순탄한 하루의 날", "막힘없이 하루가 흘러갑니다. 계획한 일을 모두 해낼 수 있습니다."], ["조금 더 노력하는 날", "조금만 더 힘내면 마무리됩니다. 마지막 10분이 중요합니다."], ["마음이 정돈되는 날", "혼란스러웠던 마음이 정돈됩니다. 오늘은 결정을 내려도 좋습니다."], ["역전의 날", "불리했던 상황이 한순간에 뒤집힙니다. 끝까지 포기하지 마세요."], ["살짝 아끼는 마음의 날", "아끼는 사람에게 작은 표현을 해 보세요. 마음이 더 가까워집니다."], ["세 갈래 길의 날", "선택지가 여러 개라도 당황하지 마세요. 가장 익숙한 길이 정답입니다."], ["가만히 있어도 되는 날", "오늘은 굳이 움직이지 않아도 괜찮습니다. 쉬는 것도 용기입니다."], ["발밑이 단단한 날", "기반이 단단해 흔들림이 없습니다. 지금 하는 일을 계속 밀고 가세요."], ["웃는 얼굴이 복을 부르는 날", "미소 하나가 좋은 일을 끌어옵니다. 거울 앞에서 한 번 웃고 나가세요."], ["조심스러운 대화의 날", "민감한 주제는 피하는 것이 좋습니다. 가벼운 이야기로 분위기를 지키세요."], ["안정된 일상의 날", "매일 하던 일을 하면 마음이 놓입니다. 오늘은 익숙함이 힘입니다."], ["손님이 복을 주는 날", "찾아온 손님이 좋은 소식을 들고 옵니다. 반갑게 맞이하세요."], ["작은 것에 감사하는 날", "큰 기쁨은 없어도 작은 것에 감사하면 하루가 따뜻해집니다."], ["조용한 진전의 날", "아무도 몰라도 일은 앞으로 나아갑니다. 결과는 곧 드러납니다."], ["체력을 아끼는 날", "무리한 운동이나 일정은 피하세요. 오늘은 회복이 먼저입니다."], ["살짝 길을 헤매는 날", "처음 가는 곳은 미리 길을 찾아 두세요. 헤매도 재미있는 발견이 있습니다."], ["일이 술술 풀리는 날", "걱정했던 일이 생각보다 쉽게 풀립니다. 한결 가벼운 마음으로 보내세요."], ["감정을 쉬게 하는 날", "감정 소모가 큰 일은 오늘 피하세요. 좋아하는 음악으로 마음을 달래세요."], ["무리 없이 해내는 날", "맡은 일을 큰 어려움 없이 해냅니다. 오늘은 평소 실력이면 충분합니다."], ["좋은 기운이 모이는 날", "주변에 좋은 사람과 좋은 소식이 모입니다. 열린 자세로 맞이하세요."], ["조금 늦게 피는 날", "남들보다 늦어도 괜찮습니다. 늦게 피는 꽃도 아름답습니다."], ["사소한 즐거움의 날", "좋아하는 간식이나 노래가 하루를 즐겁게 합니다. 작은 즐거움을 챙기세요."], ["큰 문이 열리는 날", "기다리던 기회가 활짝 열립니다. 준비해 온 것을 마음껏 펼치세요."], ["아껴 쓰는 하루의 날", "돈도 시간도 아껴 쓰면 남습니다. 꼭 필요한 곳에만 쓰세요."], ["무난한 마무리의 날", "하루가 탈 없이 마무리됩니다. 오늘의 평범함에 감사하세요."], ["생각을 멈추는 날", "고민이 꼬리를 물면 잠시 멈추세요. 따뜻한 물에 손을 담그면 편해집니다."], ["도움을 주고받는 날", "도움을 주고받으며 관계가 깊어집니다. 먼저 손을 내밀어 보세요."], ["기쁜 연락의 날", "반가운 사람에게서 연락이 옵니다. 대화가 즐겁게 이어집니다."], ["조금 꼬이는 날", "일이 살짝 꼬여도 차분히 풀면 됩니다. 하나씩 매듭을 푸세요."], ["중심을 잡는 날", "주변이 시끄러워도 내 중심을 지키면 흔들리지 않습니다."], ["재물이 모이는 날", "돈이 들어올 일이 생깁니다. 들어온 돈은 계획적으로 쓰세요."], ["작은 위기를 넘기는 날", "아슬아슬한 순간이 있지만 무사히 넘깁니다. 침착함이 나를 지킵니다."], ["정성 가득한 날", "정성을 들인 만큼 결과가 따라옵니다. 오늘은 대충이 없어야 합니다."], ["한발 늦어도 되는 날", "오늘은 앞서가려 하지 마세요. 뒤에서 따라가는 것이 편합니다."], ["꾸준한 걸음의 날", "느리지만 꾸준히 걸으면 멀리 갑니다. 오늘도 멈추지 마세요."], ["든든한 지지의 날", "가족이나 친구가 나를 응원합니다. 그 응원이 큰 힘이 됩니다."], ["쉬어 가는 주말 같은 날", "평일이라도 마음만은 주말처럼 보내세요. 여유가 필요한 날입니다."], ["기억력이 좋은 날", "중요한 것이 잘 기억납니다. 공부나 암기에 좋은 날입니다."], ["아이디어가 샘솟는 날", "새로운 생각이 계속 떠오릅니다. 떠오르는 대로 적어 두세요."], ["살짝 무거운 날", "어깨가 무겁게 느껴지면 짐을 나누세요. 혼자 다 할 필요는 없습니다."], ["조화를 이루는 날", "서로 다른 의견이 잘 어우러집니다. 중간 지점을 찾으면 모두 만족합니다."], ["복이 넘치는 날", "하는 일마다 복이 따릅니다. 오늘의 행운을 주변과 나누면 더 커집니다."], ["작은 아쉬움의 날", "아쉬움이 남아도 다음 기회가 금방 옵니다. 오늘은 툭툭 털어 버리세요."], ["차분하게 정리하는 날", "일과 생각을 차분히 정리하면 길이 보입니다. 노트를 펼쳐 보세요."], ["지갑을 닫아 두는 날", "큰 지출은 오늘 하지 마세요. 장바구니에 담아 두고 하루 더 생각하세요."], ["맛있는 하루의 날", "맛있는 음식이 기분을 좋게 합니다. 새로운 메뉴에 도전해 보세요."], ["배운 것이 쓰이는 날", "예전에 배운 것이 오늘 요긴하게 쓰입니다. 배움은 배신하지 않습니다."], ["조금 엇갈린 마음의 날", "상대와 생각이 달라도 괜찮습니다. 다름을 인정하면 편해집니다."], ["성실함이 보이는 날", "묵묵히 해 온 일을 누군가 알아봅니다. 오늘도 성실하게 하세요."], ["분위기가 좋은 날", "모임이나 회의 분위기가 밝습니다. 오늘 제안하면 받아들여질 확률이 높습니다."], ["작게 쉬는 날", "짧은 휴식이 오히려 효율을 높입니다. 커피 한 잔의 여유를 가지세요."], ["길이 보이는 날", "막막했던 일에 방향이 보입니다. 오늘 정한 방향으로 가면 됩니다."], ["기다려도 되는 날", "오늘 안 되면 내일 하면 됩니다. 조급해하지 않는 것이 이기는 길입니다."], ["정해진 대로 되는 날", "계획한 대로 일이 흘러갑니다. 변경 없이 그대로 진행하세요."], ["기분 좋은 우연의 날", "우연히 마주친 일이 좋은 결과로 이어집니다. 오늘은 즉흥도 좋습니다."], ["마음을 다독이는 날", "오늘은 나에게 다정해지세요. 스스로에게 수고했다고 말해 주세요."], ["소박하게 웃는 날", "작은 농담 하나에 크게 웃게 됩니다. 웃음이 많을수록 좋은 날입니다."], ["좋은 평가의 날", "일에 대한 평가가 좋게 나옵니다. 그동안의 노력이 인정받습니다."], ["조금 조급한 날", "마음이 급해도 순서를 지키세요. 순서를 지키면 결국 빨라집니다."], ["안정적인 흐름의 날", "큰 변동 없이 안정적입니다. 지금의 안정을 잘 지키세요."], ["소원이 이뤄지는 날", "마음속에 품었던 바람이 이루어집니다. 오늘은 마음껏 기뻐하세요."], ["작은 불편의 날", "사소한 불편이 있어도 금방 해결됩니다. 짜증 내지 않으면 금방 지나갑니다."], ["가까운 곳의 행복의 날", "멀리 찾지 않아도 행복은 가까이 있습니다. 동네 카페에 가 보세요."], ["마음을 가라앉히는 날", "흥분하면 손해를 봅니다. 오늘은 차분함을 유지하세요."], ["조용한 응원의 날", "누군가 조용히 나를 응원하고 있습니다. 힘을 내세요."], ["신나는 날", "하고 싶은 일을 할 기회가 생깁니다. 오늘은 마음껏 즐기세요."], ["조금 아쉬운 타이밍의 날", "타이밍이 살짝 어긋나도 다음 기회가 있습니다. 아쉬워하지 마세요."], ["성실하게 보내는 날", "평소처럼 성실하게 보내면 됩니다. 특별한 노력은 필요 없습니다."], ["칭찬과 격려의 날", "따뜻한 격려를 받습니다. 그 말을 힘 삼아 앞으로 나아가세요."], ["조금 버티는 날", "오늘은 조금만 버티면 됩니다. 저녁에 맛있는 걸 먹으며 보상하세요."], ["사이좋은 하루의 날", "주변 사람들과 사이좋게 지냅니다. 오늘은 다툼이 없습니다."], ["생각이 많은 날", "생각이 많아 머리가 복잡할 수 있습니다. 걷기가 생각을 정리해 줍니다."], ["하나를 마치는 날", "오래 끌던 일 하나를 마칩니다. 끝낸 기쁨을 누리세요."], ["행운의 숫자의 날", "숫자와 관련된 일에서 운이 따릅니다. 계산이나 정리가 잘 맞아떨어집니다."], ["살짝 지루한 날", "하루가 지루하게 느껴지면 작은 변화를 주세요. 새 노래를 들어 보세요."], ["쉽게 가는 날", "어렵게 생각하지 않으면 쉽게 풀립니다. 단순하게 접근하세요."], ["든든한 인맥의 날", "아는 사람을 통해 좋은 정보를 얻습니다. 인맥이 힘이 되는 날입니다."], ["조금 기다리는 하루의 날", "원하는 것이 바로 오지 않아도 오고 있습니다. 조금만 기다리세요."], ["평화로운 하루의 날", "갈등 없이 평화롭게 하루가 흘러갑니다. 이 평화를 즐기세요."], ["천천히 시작하는 날", "아침을 천천히 시작하세요. 급하게 시작하면 하루 종일 바쁩니다."], ["작게 이루는 날", "작은 목표 하나를 이루면 충분합니다. 큰 목표는 내일 생각하세요."], ["정리된 일정의 날", "일정이 깔끔하게 정리됩니다. 달력에 계획을 적어 두세요."], ["자신을 돌보는 날", "남보다 나를 먼저 돌보는 날입니다. 좋아하는 일을 하나 하세요."], ["좋은 습관을 이어 가는 날", "어제 시작한 습관을 오늘도 이어 가세요. 이틀째가 가장 중요합니다."], ["좋은 일이 다가오는 날", "멀지 않은 곳에서 좋은 일이 다가옵니다. 기대해도 좋습니다."], ["작은 갈등을 피하는 날", "사소한 말다툼은 피하세요. 한 번 참으면 하루가 편합니다."], ["무리 없는 하루의 날", "오늘은 무리하지 않아도 잘 됩니다. 힘을 빼고 자연스럽게 하세요."], ["빛이 드는 날", "오래 어두웠던 일에 밝은 빛이 듭니다. 드디어 좋은 결과를 맞이합니다."], ["살짝 미끄러지는 날", "발밑을 조심하세요. 계단이나 빗길에서는 천천히 걸으세요."], ["평범하게 좋은 날", "특별하지 않아도 충분히 좋은 하루입니다. 오늘의 소소함을 즐기세요."], ["정리하고 쉬는 날", "할 일을 정리했다면 이제 쉬세요. 쉬는 시간에는 일 생각을 접어 두세요."], ["함께 먹는 날", "함께하는 식사가 즐겁습니다. 가까운 사람과 맛있는 걸 나눠 드세요."], ["자신감 넘치는 날", "자신감이 생겨 무엇이든 해낼 것 같습니다. 그 기분대로 도전해 보세요." 습니다."], ["부드러운 대화의 날", "대화가 부드럽게 오갑니다. 하고 싶던 말을 꺼내기 좋은 날입니다."], ["사랑이 깊어지는 날", "가까운 사람과 마음이 더 가까워집니다. 작은 표현이 큰 감동을 줍니다."], ["조금 지친 마음의 날", "마음이 지치면 잠시 쉬세요. 좋아하는 것을 하며 기운을 채우세요."], ["평온한 아침의 날", "아침이 평온하면 하루가 평온합니다. 여유 있게 아침을 시작하세요."], ["오늘은 쉼표의 날", "마침표 대신 쉼표를 찍으세요. 끝내지 않아도 괜찮은 날입니다."], ["소소한 정리의 날", "작은 것부터 정리하면 큰 것도 정리됩니다. 휴대폰 사진부터 정리해 보세요."], ["행운의 만남의 날", "우연한 만남이 좋은 기회가 됩니다. 오늘은 약속을 거절하지 마세요."], ["살짝 늦은 출발의 날", "출발이 늦어도 도착은 늦지 않습니다. 침착하게 움직이세요."], ["좋은 기분의 날", "이유 없이 기분이 좋습니다. 그 기분으로 하고 싶던 일을 하세요."], ["자랑스러운 날", "스스로가 자랑스러워지는 일이 생깁니다. 오늘의 나를 칭찬하세요."], ["조금 신중한 날", "확실하지 않은 일은 하루 더 지켜보세요. 신중함이 손해를 막습니다."], ["가벼운 발걸음의 날", "마음이 가벼워 어디든 가고 싶어집니다. 가까운 곳으로 나들이를 가 보세요."], ["대길의 기운이 감도는 날", "오늘은 하늘의 운이 함께합니다. 미뤄 둔 큰일을 처리하기에 최적입니다."], ["작은 실망을 넘는 날", "작은 실망이 있어도 곧 잊힙니다. 다른 즐거움으로 채우세요."], ["함께하는 점심의 날", "함께하는 식사에서 좋은 이야기가 오갑니다. 점심 약속을 잡아 보세요."], ["화를 다스리는 날", "짜증이 날 수 있지만 표현은 아끼세요. 한 번 참으면 후회가 없습니다."], ["익숙한 손맛의 날", "집밥이나 익숙한 음식이 위로가 됩니다. 오늘은 외식보다 집밥을 드세요."], ["기쁨을 나누는 날", "기쁜 일을 나누면 두 배가 됩니다. 좋은 소식을 주변에 알리세요."], ["조금 엇나가는 날", "계획이 살짝 엇나가도 결과는 나쁘지 않습니다. 유연하게 대처하세요."], ["오래 가는 하루의 날", "오늘 한 일이 오래 기억됩니다. 대충 하지 말고 정성껏 하세요."], ["든든한 하루의 시작의 날", "아침부터 좋은 기운이 감돕니다. 오늘 중요한 일을 처리하세요."], ["살짝 무거운 발걸음의 날", "발걸음이 무거워도 걷다 보면 가벼워집니다. 일단 시작하세요."], ["오늘을 기록하는 날", "오늘 있었던 일을 기록해 두면 나중에 소중한 추억이 됩니다."], ["조용히 기다리는 하루의 날", "오늘은 결과를 기다리는 날입니다. 초조해하지 말고 일상을 지키세요."], ["마음이 넓어지는 날", "이해하는 마음이 커집니다. 다른 사람의 입장에서 생각해 보세요."], ["성공의 발판의 날", "오늘의 일이 다음 성공의 발판이 됩니다. 최선을 다할 가치가 있습니다."], ["작은 걱정의 날", "걱정은 생각보다 작습니다. 종이에 적으면 별것 아님을 알게 됩니다."], ["산책이 즐거운 날", "걷기 좋은 날입니다. 걸으며 생각을 정리하면 답이 나옵니다."], ["좋은 소식을 전하는 날", "내가 전하는 소식이 누군가에게 기쁨이 됩니다. 먼저 연락해 보세요."], ["조금 피곤한 하루의 날", "피로가 느껴지면 일찍 쉬세요. 오늘의 휴식이 내일의 힘입니다."], ["무리 없는 계획의 날", "무리하지 않는 계획이 오래 갑니다. 할 수 있는 만큼만 계획하세요."], ["혼자 정리하는 날", "혼자만의 시간에 생각을 정리하세요. 조용한 곳이 도움이 됩니다."], ["살짝 아쉬운 하루의 날", "조금 아쉬워도 내일이 있습니다. 오늘은 여기까지 하세요."], ["생활의 지혜의 날", "작은 요령이 생활을 편하게 합니다. 정리 비법이나 요리 팁을 찾아보세요."], ["움츠러드는 날", "기운이 없으면 억지로 힘내지 마세요. 따뜻한 곳에서 쉬는 것이 좋습니다."], ["어울림의 날", "사람들과 어울리면 즐겁습니다. 모임에 가볍게 참여해 보세요."], ["기다리던 날", "드디어 기다리던 때가 왔습니다. 준비한 것을 꺼내 보세요."], ["작은 친절을 받는 날", "낯선 사람의 친절에 기분이 좋아집니다. 나도 친절을 이어 가세요."], ["정성스러운 식탁의 날", "정성 들여 차린 밥상이 마음을 채웁니다. 오늘은 직접 요리해 보세요."], ["하늘이 열리는 날", "오랜 노력이 드디어 하늘에 닿습니다. 오늘은 무엇을 해도 큰 성과가 납니다."], ["소소한 다툼을 피하는 날", "사소한 일로 다투지 마세요. 웃으며 넘기면 하루가 편합니다."], ["순조로운 출근길의 날", "출근길이 막힘없이 순조롭습니다. 여유 있게 하루를 시작하세요."], ["무리 없이 쉬는 날", "오늘은 무리하지 말고 쉬엄쉬엄 하세요. 내일을 위한 쉼입니다."], ["소소한 대화의 날", "가벼운 수다가 기분을 풀어 줍니다. 동료와 차 한 잔 나누세요."], ["행운을 부르는 미소의 날", "웃는 얼굴로 다니면 좋은 일이 생깁니다. 오늘은 많이 웃으세요."], ["조금 꼼꼼해야 하는 날", "세부 사항을 놓치기 쉽습니다. 마지막 확인을 꼭 하세요."], ["오후가 좋은 날", "오전보다 오후에 일이 잘 풀립니다. 중요한 일은 오후로 잡으세요."], ["좋은 날씨 같은 날", "날씨처럼 기분이 맑습니다. 야외 활동을 하기 좋은 날입니다."], ["살짝 피해 가는 길의 날", "복잡한 곳을 피하면 편합니다. 한적한 길로 돌아가세요."], ["천천히 쌓는 날", "급하게 쌓으면 무너집니다. 천천히 단단하게 쌓으세요."], ["자극을 피하는 날", "맵고 짠 음식보다 순한 음식이 좋습니다. 몸을 편하게 해 주세요."], ["조금 망설이는 마음의 날", "마음이 정해지지 않으면 기다려도 됩니다. 억지로 결정하지 마세요."], ["빛나는 하루의 날", "나의 매력이 돋보입니다. 사람들 앞에 나서기 좋은 날입니다."], ["한 템포 쉬는 날", "일을 잠시 멈추고 숨을 고르세요. 쉬고 나면 더 잘 됩니다."], ["소중한 시간의 날", "가까운 사람과 보내는 시간이 소중합니다. 함께하는 시간을 만드세요."], ["만족스러운 결과의 날", "기대한 만큼, 혹은 그 이상의 결과가 나옵니다. 오늘은 뿌듯한 날입니다."], ["조금 더 기다려야 하는 날", "원하는 소식이 조금 늦어집니다. 조급해하지 말고 기다리세요."], ["조용한 집중의 날", "조용한 환경에서 일이 잘 됩니다. 방해 요소를 줄이세요."], ["기적 같은 날", "안 될 것 같던 일이 기적처럼 이루어집니다. 오늘을 오래 기억하게 됩니다."], ["작은 짐을 덜어 내는 날", "가방이나 마음의 짐을 조금 덜어 내세요. 가벼워지면 편합니다."], ["기본을 지키는 하루의 날", "기본을 지키면 실수가 없습니다. 인사와 감사를 잊지 마세요."], ["무난히 넘기는 날", "오늘은 무난히 넘기는 것이 목표입니다. 큰 일은 벌이지 마세요."], ["정다운 날", "정다운 사람들과 함께해 마음이 따뜻합니다. 고마운 마음을 표현하세요."], ["행운의 시간의 날", "오늘 오후 늦게 좋은 일이 생깁니다. 그때를 기대하세요."], ["소소하게 아끼는 날", "작은 절약이 모여 큰 여유가 됩니다. 오늘은 커피값을 아껴 보세요."], ["생각대로 되는 날", "생각한 대로 일이 흘러갑니다. 계획을 믿고 그대로 하세요."], ["복이 들어오는 문의 날", "현관을 깨끗이 하면 복이 들어옵니다. 집 정리를 하면 좋은 일이 생깁니다."], ["살짝 지친 하루의 날", "오늘은 힘을 덜 쓰고 효율적으로 일하세요. 중요한 것만 하세요."], ["웃으며 마치는 날", "하루를 웃으며 마무리합니다. 좋았던 순간을 떠올리며 잠드세요."], ["고요함이 필요한 날", "시끄러운 곳보다 조용한 곳이 맞습니다. 오늘은 고요함을 찾으세요."], ["주사위를 굴리는 날", "결과가 예상과 다를 수 있습니다. 어떤 결과든 웃으며 받아들이세요."], ["좋은 패가 들어오는 날", "손에 좋은 기회가 쥐어집니다. 망설이지 말고 활용하세요."], ["판을 벌이지 않는 날", "오늘은 내기나 모험을 피하세요. 지키는 것이 이기는 날입니다."], ["차례를 기다리는 날", "내 순서가 오면 그때 움직이세요. 기다리는 동안 준비하면 됩니다."], ["육각형처럼 단단한 날", "빈틈없이 일이 짜여 갑니다. 오늘은 계획대로 밀고 나가세요."], ["살짝 흔들리는 판의 날", "변수가 생겨도 당황하지 마세요. 차분히 다시 맞추면 됩니다."], ["여섯 시의 저녁의 날", "저녁 시간이 여유롭습니다. 일찍 퇴근해 나를 위한 시간을 가지세요."], ["여섯 개의 눈이 모두 뜬 날", "모든 조건이 갖춰졌습니다. 오늘 도전하면 원하는 결과를 얻습니다."], ["조금 엉뚱한 날", "예상 밖의 일이 생겨도 즐기세요. 엉뚱함이 재미를 줍니다."], ["규칙을 지키는 하루의 날", "규칙대로 하면 문제가 없습니다. 지름길보다 정해진 길을 가세요."], ["게임을 잠시 멈추는 날", "오늘은 경쟁에서 한발 물러서세요. 쉬어 가도 늦지 않습니다."], ["공평한 하루의 날", "주고받는 것이 공평합니다. 오늘은 거래나 분배가 무난합니다."], ["운이 따르는 선택의 날", "고른 것이 좋은 결과로 이어집니다. 오늘은 직감을 믿으세요."], ["작게 이기는 판의 날", "큰 승리보다 작은 승리에 만족하세요. 작은 성공이 쌓입니다."], ["함께 노는 날", "사람들과 어울려 즐겁게 보냅니다. 가벼운 놀이나 운동을 함께하세요."], ["여유롭게 이기는 날", "힘들이지 않아도 결과가 좋습니다. 오늘은 여유를 가지세요."], ["한 번 더 굴리는 날", "첫 시도가 아쉬워도 한 번 더 하면 됩니다. 포기하지 마세요."], ["판을 정리하는 날", "어질러진 것을 정리하면 다음이 수월합니다. 오늘은 정리의 날입니다."], ["조심스럽게 걷는 날", "낯선 길보다 익숙한 길을 택하세요. 오늘은 안전이 우선입니다."], ["소소한 승부의 날", "작은 경쟁에서 무난한 결과를 얻습니다. 즐기는 마음이 중요합니다."], ["기분 좋은 반전의 날", "예상과 다르게 좋은 쪽으로 풀립니다. 걱정이 기쁨으로 바뀝니다."], ["조용히 판을 지켜보는 날", "직접 나서기보다 지켜보는 것이 좋습니다. 관찰이 답을 알려 줍니다."], ["꾸준한 점수의 날", "조금씩 점수를 쌓아 갑니다. 오늘도 차곡차곡 쌓으세요."], ["팀워크의 날", "함께하는 사람들과 호흡이 좋습니다. 팀으로 움직이면 성과가 큽니다."], ["살짝 지는 날", "조금 져도 괜찮습니다. 지는 것에서 배우는 것이 많습니다."], ["웃으며 하는 날", "즐겁게 하면 결과도 좋습니다. 오늘은 재미를 찾으세요."], ["만점의 날", "하는 일마다 최고의 점수를 받습니다. 오늘은 당신이 주인공입니다."], ["아쉬운 한 끗의 날", "아깝게 놓쳐도 다음엔 잡을 수 있습니다. 실력은 이미 충분합니다."], ["공정한 판단의 날", "판단이 정확하고 공정합니다. 중재하거나 결정할 일에 좋습니다."], ["무리한 승부를 피하는 날", "이기려고 무리하면 손해를 봅니다. 오늘은 비기는 것도 괜찮습니다."], ["느긋한 주말 같은 날", "여유로운 마음으로 하루를 보내세요. 서두를 일이 없습니다."], ["행운의 숫자가 나오는 날", "원하는 숫자가 나오듯 일이 풀립니다. 오늘은 운이 내 편입니다."], ["조금 서두르는 마음의 날", "마음이 앞서도 손은 천천히 움직이세요. 실수를 줄일 수 있습니다."], ["정직한 승부의 날", "꼼수보다 정직함이 통합니다. 오늘은 정면 돌파가 답입니다."], ["칭찬받는 판단의 날", "내린 판단이 옳았다고 인정받습니다. 자신감을 가지세요."], ["살짝 엇갈린 계산의 날", "숫자나 계산을 다시 확인하세요. 작은 착오를 막을 수 있습니다."], ["무난한 결과의 날", "큰 이득은 없어도 손해도 없습니다. 무난함에 만족하세요."], ["게임보다 휴식의 날", "오늘은 머리를 쓰는 일보다 쉬는 것이 좋습니다. 일찍 잠자리에 드세요."], ["함께 정하는 날", "혼자 정하기보다 함께 정하세요. 여러 의견이 좋은 답을 만듭니다."], ["재미있는 일이 생기는 날", "지루하던 일상에 재미있는 일이 생깁니다. 즐겁게 참여하세요."], ["조금 불리한 날", "조건이 살짝 불리해도 침착하면 괜찮습니다. 기회는 다시 옵니다."], ["운과 노력이 반반인 날", "노력한 만큼 운도 따라옵니다. 오늘은 성실함이 운을 부릅니다."], ["쉽게 풀리는 문제의 날", "어려워 보였던 문제가 쉽게 풀립니다. 자신 있게 도전하세요."], ["작은 실수를 줄이는 날", "서두르면 실수가 생깁니다. 차분하게 하나씩 하세요."], ["평범한 승리의 날", "소소하지만 확실한 성과를 얻습니다. 오늘의 작은 승리를 즐기세요."], ["운에 기대지 않는 날", "오늘은 운보다 실력에 기대세요. 확실한 것만 하세요."], ["살짝 아쉬운 운의 날", "운이 조금 비켜 가도 괜찮습니다. 내일은 다시 돌아옵니다."], ["규칙적인 생활의 날", "생활 리듬이 안정됩니다. 같은 시간에 먹고 자면 몸이 좋아합니다."], ["기대 없이 즐기는 날", "결과를 기대하지 말고 과정을 즐기세요. 마음이 편해집니다."], ["짝을 맞추는 날", "흩어진 것들의 짝이 맞춰집니다. 일정이나 사람이 잘 맞습니다."], ["행운의 판의 날", "오늘은 판이 내 쪽으로 기울어 있습니다. 적극적으로 나서세요."], ["조금 조심스러운 승부의 날", "무리한 도전보다 작은 도전이 좋습니다. 안전하게 가세요."], ["안정된 승부의 날", "흔들림 없이 내 페이스를 지킵니다. 오늘은 꾸준함이 이깁니다."], ["모든 패가 좋은 날", "어떤 선택을 해도 좋은 결과가 나옵니다. 오늘은 마음껏 도전하세요."], ["살짝 꼬이는 일정의 날", "일정이 조금 꼬여도 금방 풀립니다. 여유 시간을 두세요."], ["함께 즐기는 저녁의 날", "저녁 시간에 즐거운 일이 있습니다. 가족이나 친구와 함께하세요."], ["무리한 계획을 접는 날", "오늘은 계획을 줄이세요. 적게 하는 것이 더 잘하는 날입니다."], ["조금씩 이기는 날", "조금씩 앞서 나갑니다. 오늘의 작은 승리가 모입니다."], ["좋은 동료의 날", "함께하는 동료가 큰 힘이 됩니다. 고맙다는 말을 전하세요."], ["살짝 엇나간 예측의 날", "예상과 다르게 흘러가도 괜찮습니다. 유연하게 대처하세요."], ["소박한 재미의 날", "작은 재미가 하루를 채웁니다. 보드게임이나 퍼즐을 해 보세요."], ["행운의 굴림의 날", "가볍게 던진 시도가 좋은 결과로 돌아옵니다. 오늘은 부담 없이 시도하세요."], ["조금 피하는 날", "불편한 자리는 피해도 괜찮습니다. 오늘은 편한 사람과 보내세요."], ["차분한 승부의 날", "감정보다 이성으로 판단하세요. 차분함이 좋은 결과를 만듭니다."], ["한판 쉬는 날", "오늘은 한 판 쉬어 가세요. 쉬는 동안 상황이 정리됩니다."], ["작은 내기에 지는 날", "사소한 내기는 져도 웃으세요. 오늘은 내기를 피하는 것이 좋습니다."], ["좋은 흐름을 타는 날", "좋은 흐름이 이어집니다. 기세를 몰아 일을 처리하세요."], ["쉬는 것이 이기는 날", "오늘은 아무것도 하지 않는 것도 전략입니다. 푹 쉬세요."], ["무난한 놀이의 날", "가볍게 즐기는 것이 좋습니다. 부담 없는 여가를 보내세요."], ["웃음 가득한 판의 날", "즐거운 사람들과 웃을 일이 많습니다. 함께하는 시간을 즐기세요."], ["조금 서툰 하루의 날", "익숙하지 않은 일이 서툴러도 괜찮습니다. 배우는 과정입니다."], ["정확한 하루의 날", "시간과 일정이 정확하게 맞습니다. 약속을 잡기 좋은 날입니다."], ["행운의 대박의 날", "오늘은 큰 행운이 찾아옵니다. 평소 바라던 것에 도전해 보세요."], ["조금 서두른 결정의 날", "급하게 내린 결정은 다시 검토하세요. 하루 지나면 더 잘 보입니다."], ["함께 웃는 저녁의 날", "하루를 함께 웃으며 마무리합니다. 저녁 식사를 함께하세요."], ["조심스러운 하루의 날", "오늘은 조심해서 나쁠 것이 없습니다. 무리하지 마세요." // 번호에 631을 곱해 섞은 뒤(겹치지 않는 순서 바꾸기) 구간으로 나눠 등급이 0~999에 고루 흩어지게 함
const GRADE_CUTS=[50,250,600,850,1000];
const gradeOf=n=>{const k=(n*631)%1000;return GRADE_CUTS.findIndex(c=>k<c);};
function luckyArt(item){

}

function parse(s){
  const m = s.trim().match(/^(\d{4})[.\-/ ]?(\d{1,2})[.\-/ ]?(\d{1,2})$/);
  if(!m) return null;
  const y=+m[1], mo=+m[2], d=+m[3];
  const dt=new Date(y,mo-1,d);
  if(dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d) return null;
  return {y,mo,d};
}

// 생년월일 번호 = (연 × 월 × 일) × (오늘 날짜의 '일', 1~31) 의 만·천·십의 자리
//   그 자리가 0이면 더 높은 자리로 한 칸씩 올라가며 0이 아닌 첫 숫자를 쓴다
//   (맨 앞자리까지 0뿐이면 맨 끝 자리부터 다시 찾는다) → 생년월일 번호에는 0이 나오지 않음
function nonZeroDigit(n,p){
  const s=String(n);
  for(let k=0;k<s.length;k++){
    let i=s.length-1-p-k; i=((i%s.length)+s.length)%s.length;
    if(s[i]!=="0")return +s[i];
  }
  return 1;
}
function fortune({y,mo,d},today){
  const product = y*mo*d;
  const day = today.getDate();
  const n = product*day;
  return {product, code:[4,3,1].map(p=>nonZeroDigit(n,p)).join("")};
}

  document.getElementById("sampleTag").hidden=!sample;

  const {product,code}=fortune(b,today);
  document.getElementById("birthTag").textContent=`생년월일 번호 · ${today.getFullYear()}.${pad(today.getMonth()+1)}.${pad(today.getDate())}`;
  const hundreds=stampInto("digits",code,0);
  const [tens,ones]=renderTime(product,400);
  // 최종 번호 = 백: 생년월일 줄 오른쪽 숫자, 십: 분 단위 줄, 일: 초 단위 줄 → 0~999
  const fin=document.getElementById("final");
  fin.textContent=hundreds*100+tens*10+ones;
  fin.classList.remove("pop"); void fin.offsetWidth; fin.classList.add("pop");
  document.getElementById("todayReading").innerHTML=readingHTML(hundreds*100+tens*10+ones);
  document.getElementById("igDate").textContent=`${today.getFullYear()}.${pad(today.getMonth()+1)}.${pad(today.getDate())}`;
  document.getElementById("igTime").textContent=document.getElementById("time").value;
  current={n:hundreds*100+tens*10+ones,date:document.getElementById("igDate").textContent,
    time:document.getElementById("time").value,sample};
  document.getElementById("sharePreview").hidden=true;
  document.getElementById("shareFallback").hidden=true;
  document.getElementById("shareMsg").textContent=sample?"지금은 예시 카드예요. 내 생년월일로 뽑은 뒤 공유해 보세요.":"";
}

// ───── 카드 공유 ─────
// 카드를 1080×1350(인스타 4:5) PNG로 직접 그려서 저장하거나, 공유 문구를 복사한다
let current=null;
const dlReady=(window.claude&&window.claude.use)?window.claude.use("downloads").catch(()=>null):Promise.resolve(null);
const inArtifact=!!(window.claude&&window.claude.use);
// 공유 링크: 웹에 올린 경우(GitHub Pages 등) 그 주소를 쓰고, 그 밖에는 Claude 페이지 주소를 씀
const SHARE_LINK=(!inArtifact&&/^https?:$/.test(location.protocol))
  ? location.origin+location.pathname.replace(/index\.html$/,"")
  : "https://claude.ai/artifact/DM2vprBsqzbKLZFNjmX2UZ";

function svgImage(item,size){
  const i=item.indexOf(" "), C=SWATCH[item.slice(0,i)], L=C==="#ffffff"?"#d9d2c3":"#fff";
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="${size}" height="${size}"><g stroke="#2a1f14" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">${OBJ_ART[item.slice(i+1)](C,L)}</g></svg>`;
  return new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;
    im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);});
}
function wrapLines(ctx,text,maxW){
  const out=[];
  [text].forEach(sent=>{
    let line="";
    sent.split(" ").forEach(w=>{const t=line?line+" "+w:w;
      if(ctx.measureText(t).width>maxW&&line){out.push(line);line=w;}else line=t;});
    if(line)out.push(line);
  });
  return out;
}
async function drawCard({n,date,time}){
  const W=1080,H=1350,u=W/100;
  const DISPLAY='"Song Myung","Gowun Batang",serif', BODY='"Gowun Batang","Apple SD Gothic Neo","Malgun Gothic",serif';
  try{await Promise.all([document.fonts.load(`400 ${17*u}px "Song Myung"`),document.fonts.load(`400 ${4*u}px "Gowun Batang"`),document.fonts.load(`700 ${4*u}px "Gowun Batang"`)]);}catch(e){}
  const cv=document.createElement("canvas");cv.width=W;cv.height=H;
  const c=cv.getContext("2d"), RED="#b4231a", INK="#2a1f14", MUTED="#6e5d45";
  c.fillStyle="#fffaf0";c.fillRect(0,0,W,H);
  c.strokeStyle="#d6c48a";c.lineWidth=3;c.strokeRect(1.5,1.5,W-3,H-3);
  c.strokeStyle="rgba(180,35,26,.7)";c.lineWidth=.6*u/3;
  [3*u,3*u+.4*u].forEach(d=>c.strokeRect(d,d,W-2*d,H-2*d));
  c.textBaseline="alphabetic";
  const g=gradeOf(n), [title,text]=FORTUNES[n], item=LUCKY[n];
  // 왼쪽 위: 행운의 숫자
  c.textAlign="left";c.fillStyle=MUTED;c.font=`400 ${2.8*u}px ${BODY}`;c.fillText("행 운 의  숫 자",8*u,11*u);
  c.fillStyle=RED;c.font=`400 ${17*u}px ${DISPLAY}`;c.fillText(String(n),7.6*u,26.5*u);
  // 오른쪽 위: 도장 + 이름
  c.fillStyle=RED;c.beginPath();c.arc(W-8*u-4.5*u,13*u,4.5*u,0,Math.PI*2);c.fill();
  c.fillStyle="#fff8ec";c.textAlign="center";c.font=`400 ${4.6*u}px ${DISPLAY}`;c.fillText("運",W-12.5*u,14.6*u);
  c.textAlign="right";c.fillStyle=INK;c.font=`700 ${3.6*u}px ${BODY}`;c.fillText("오늘의 운세",W-19.5*u,12.6*u);
  c.fillStyle=MUTED;c.font=`400 ${2.8*u}px ${BODY}`;c.fillText(date,W-19.5*u,16.4*u);
  // 가운데: 행운의 물건
  c.fillStyle="#f8eebb";c.beginPath();c.arc(W/2,45*u,16*u,0,Math.PI*2);c.fill();
  try{const im=await svgImage(item,24*u*2);c.drawImage(im,W/2-12*u,33*u,24*u,24*u);}catch(e){}
  c.textAlign="center";c.fillStyle=MUTED;c.font=`400 ${2.8*u}px ${BODY}`;c.fillText("행 운 의  물 건",W/2,66*u);
  c.fillStyle=INK;c.font=`700 ${4.8*u}px ${BODY}`;c.fillText(item,W/2,72.5*u);
  // 등급 + 제목
  c.font=`400 ${6.4*u}px ${DISPLAY}`;const tw=c.measureText(title).width;
  c.font=`700 ${3.4*u}px ${BODY}`;const gl=GRADES[g].split("").join(" "), gw=c.measureText(gl).width+6*u, gh=6.2*u;
  const total=gw+2.4*u+tw, x0=W/2-total/2, cy=81*u;
  if(g===0){c.fillStyle=RED;c.fillRect(x0,cy-gh/2,gw,gh);}
  c.strokeStyle=RED;c.lineWidth=.4*u;c.strokeRect(x0,cy-gh/2,gw,gh);
  c.fillStyle=g===0?"#fff8ec":RED;c.textAlign="center";c.fillText(gl,x0+gw/2,cy+1.2*u);
  c.fillStyle=INK;c.textAlign="left";c.font=`400 ${6.4*u}px ${DISPLAY}`;c.fillText(title,x0+gw+2.4*u,cy+2.2*u);
  // 풀이
  c.textAlign="center";c.fillStyle="#3d2f20";c.font=`400 ${3.8*u}px ${BODY}`;
  let lines=wrapLines(c,text,84*u);
  if(lines.length>2){c.font=`400 ${3.3*u}px ${BODY}`;lines=wrapLines(c,text,86*u);}
  const lh=lines.length>2?4.9:6, y0=lines.length>2?89.5:90.5;
  lines.slice(0,3).forEach((l,i)=>c.fillText(l,W/2,(y0+i*lh)*u));
  // 응원 문구
  c.strokeStyle="#d6c48a";c.lineWidth=.3*u;c.setLineDash([1*u,.8*u]);
  c.beginPath();c.moveTo(8*u,102.5*u);c.lineTo(W-8*u,102.5*u);c.stroke();c.setLineDash([]);
  c.fillStyle=RED;c.font=`700 ${3.2*u}px ${BODY}`;
  c.fillText("오늘 하루 행운의 물건을 가까이 두고,",W/2,107.8*u);
  c.fillText("오늘의 운세를 떠올리며 긍정적인 하루 보내세요!",W/2,112.6*u);
  // 아래: 해시태그 + 시각
  c.font=`400 ${2.9*u}px ${BODY}`;c.textAlign="left";c.fillText("#오늘의운세 #행운번호",7.5*u,118.6*u);
  c.textAlign="right";c.fillStyle=MUTED;c.fillText(time||"",W-7.5*u,118.6*u);
  return new Promise(ok=>cv.toBlob(ok,"image/png"));
}

function setMsg(t){document.getElementById("shareMsg").textContent=t;}
function showPreview(blob){
  const img=document.getElementById("sharePreviewImg");
  if(img.dataset.url)URL.revokeObjectURL(img.dataset.url);
  img.dataset.url=URL.createObjectURL(blob);img.src=img.dataset.url;
  document.getElementById("sharePreview").hidden=false;
}
document.getElementById("saveCard").addEventListener("click",async e=>{
  if(!current)return;
  const btn=e.currentTarget;btn.disabled=true;setMsg("카드 이미지를 만드는 중이에요…");
  try{
    const blob=await drawCard(current);
    const filename=`오늘의운세_${current.date.replace(/\./g,"")}_${String(current.n).padStart(3,"0")}.png`;
    if(inArtifact){
      const dl=await dlReady;
      if(dl){
        try{await dl.save({filename,data:blob});setMsg("카드 이미지를 저장했어요. 인스타·카톡·블로그에 올려 보세요!");}
        catch(err){
          if(err&&err.code==="declined")setMsg("저장을 취소했어요.");
          else if(err&&err.code==="rate_limited")setMsg("저장 창이 이미 열려 있어요. 잠시 뒤 다시 눌러 주세요.");
          else{showPreview(blob);setMsg("여기서는 바로 저장이 안 돼요. 아래 이미지를 직접 저장해 주세요.");}
        }
      }else{showPreview(blob);setMsg("아래 카드 이미지를 직접 저장해 주세요.");}
    }else{
      const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;
      document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
      setMsg("카드 이미지를 내려받았어요.");
    }
  }catch(err){setMsg("카드 이미지를 만들지 못했어요. 다시 눌러 주세요.");}
  finally{btn.disabled=false;}
});
function shareText(){
  const {n}=current, g=GRADES[gradeOf(n)], [title]=FORTUNES[n];
  return `🍀 오늘의 행운 번호는 ${n}!\n[${g}] ${title}\n행운의 물건: ${LUCKY[n]}\n\n나도 운세 뽑아 보기 👉 ${SHARE_LINK}\n#오늘의운세 #행운번호`;
}
document.getElementById("copyText").addEventListener("click",()=>{
  if(!current)return;
  const t=shareText(), fb=document.getElementById("shareFallback");
  const fallback=()=>{fb.value=t;fb.hidden=false;fb.focus();fb.select();setMsg("아래 문구를 복사해서 붙여 넣어 주세요.");};
  try{
    navigator.clipboard.writeText(t).then(()=>{fb.hidden=true;setMsg("공유 문구를 복사했어요. 카톡이나 댓글에 붙여 넣어 보세요.");},fallback);
  }catch(e){fallback();}
});

const pad=n=>String(n).padStart(2,"0");
// 오른쪽 숫자 = 세 숫자를 더한 값의 일의 자리
const tensOfProduct=str=>[...str].reduce((a,c)=>a+ +c,0)%10;
function stampInto(el,str,delay){
  const cells=[...str].map((c,i)=>({c,cls:"d"})).concat({c:String(tensOfProduct(str)),cls:"d extra"});
  document.getElementById(el).innerHTML=cells.map(({c,cls},i)=>
    delay===null?card(c,cls):card(c,cls+" pop",` style="animation-delay:${delay+i*120}ms"`)).join("");
  return tensOfProduct(str);
}
// 자리 숫자 뽑기: 10^p 자리의 숫자
const digitAt=(n,p)=>Math.floor(n/10**p)%10;
// 분 단위 번호 = (연×월×일) × 시 × 분 의 만·천·백의 자리
// 초 단위 번호 = (연×월×일) × 시 × 분 × 초 의 십만·천·십의 자리
//   0시는 24, 0분·0초는 60으로 계산하고, 뽑은 자리가 0이면 생년월일 번호처럼 위 자리의 0이 아닌 숫자를 씀
// 시각은 버튼을 누를 때 컴퓨터 시계에서 가져옴 (자동 갱신 없음)
function renderTime(birth,delay=null){
  const now=new Date(), h=now.getHours(), mi=now.getMinutes(), se=now.getSeconds();
  document.getElementById("time").value=`${pad(h)}:${pad(mi)}:${pad(se)}`;
  const mN=birth*(h||24)*(mi||60), sN=mN*(se||60);
  const mcode=[4,3,2].map(p=>nonZeroDigit(mN,p)).join("");
  const scode=[5,3,1].map(p=>nonZeroDigit(sN,p)).join("");
  const mTag=`분 단위 번호 · ${pad(h)}:${pad(mi)}`;
  const minTag=document.getElementById("minTag");
  minTag.textContent=mTag; const t=stampInto("minDigits",mcode,delay);
  document.getElementById("secTag").textContent=`초 단위 번호 · ${pad(h)}:${pad(mi)}:${pad(se)}`;
  const o=stampInto("secDigits",scode,delay===null?null:delay+400);
  return [t,o];
}

const input=document.getElementById("birth");
input.addEventListener("input",()=>{ // 숫자만 쳐도 점 자동 삽입
  const n=input.value.replace(/\D/g,"").slice(0,8);
  input.value=n.length>6?`${n.slice(0,4)}.${n.slice(4,6)}.${n.slice(6)}`:n.length>4?`${n.slice(0,4)}.${n.slice(4)}`:n;
});
document.getElementById("f").addEventListener("submit",e=>{e.preventDefault();if(document.activeElement)document.activeElement.blur();render();});

render(true); // 처음 열면 예시 생년월일로 만든 예시 카드를 보여 줌
